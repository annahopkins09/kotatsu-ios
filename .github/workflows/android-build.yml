name: Android CI & Release

on:
  push:
    branches:
      - devel
      - master
  pull_request:
    branches:
      - devel
      - master
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build variant to assemble'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - nightly
      parsers_ref:
        description: 'kotatsu-parsers branch/tag/SHA to build against (blank = default branch)'
        required: false
        default: ''
        type: string

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PARSERS_REPO: Admin-Dev-git/kotatsu-parsers
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2g -Dorg.gradle.daemon=false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: kotatsu-ios

      - name: Checkout parsers
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PARSERS_REPO }}
          ref: ${{ github.event.inputs.parsers_ref || '' }}
          path: kotatsu-parsers

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        run: |
          ANDROID_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "${ANDROID_ROOT}/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "${ANDROID_ROOT}/platform-tools" >> $GITHUB_PATH
          SDKMANAGER="${ANDROID_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes 2>/dev/null | "${SDKMANAGER}" --licenses || true
          "${SDKMANAGER}" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Configure local.properties
        working-directory: kotatsu-ios
        run: echo "sdk.dir=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> local.properties

      - name: Resolve keystore for release signing
        env:
          KOTATSU_KEYSTORE_B64: ${{ secrets.KOTATSU_KEYSTORE_B64 }}
        run: |
          if [[ -n "${KOTATSU_KEYSTORE_B64}" ]]; then
            echo "${KOTATSU_KEYSTORE_B64}" | base64 -d > kotatsu-ios/app/debug.keystore
            echo "Signing with the keystore from the KOTATSU_KEYSTORE_B64 secret."
          elif [[ -s kotatsu-ios/app/debug.keystore ]]; then
            echo "Signing with the debug.keystore committed to the repository."
          else
            echo "::error::No keystore available: KOTATSU_KEYSTORE_B64 is unset and app/debug.keystore is missing."
            exit 1
          fi

      - name: Publish parsers to Maven Local
        working-directory: kotatsu-parsers
        run: ./gradlew publishToMavenLocal -x test --no-daemon --stacktrace

      - name: Build ${{ github.event.inputs.variant || 'release' }} APK
        working-directory: kotatsu-ios
        run: |
          ./gradlew \
            assemble${{ github.event.inputs.variant || 'release' }} \
            --no-daemon \
            --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ github.event.inputs.variant || 'release' }}-apk
          path: |
            kotatsu-ios/app/build/outputs/apk/${{ github.event.inputs.variant || 'release' }}/**/*.apk
          if-no-files-found: error
          retention-days: 14
